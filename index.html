<style>
:root {
    --primary: #0f172a;
    --secondary: #1e293b;
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --bg: #f8fafc;
    --text: #334155;
    --text-light: #64748b;
    --success: #10b981;
    --danger: #ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

.header{background:var(--primary);color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--accent)}
.logo{display:flex;align-items:center;gap:15px}
.logo-icon{width:45px;height:45px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--primary);font-weight:bold}
.logo h1{font-size:1.8em;letter-spacing:1px;font-weight:700}
.logo h1 span{color:var(--accent);font-weight:300}

.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);color:#fff;padding:60px 40px;text-align:center}
.hero h2{font-size:2.5em;margin-bottom:15px;font-weight:700;line-height:1.2}
.hero h2 span{color:var(--accent)}
.hero p{font-size:1.1em;color:#cbd5e1;max-width:800px;margin:0 auto}

.container{max-width:1200px;margin:0 auto;padding:30px 20px}

.section-title{text-align:center;margin-bottom:30px}
.section-title h3{font-size:1.8em;color:var(--primary);margin-bottom:10px}
.section-title p{color:var(--text-light);font-size:1em}

.cases-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:40px}
.case-card{background:#fff;border-radius:12px;padding:20px;border-left:5px solid var(--accent);box-shadow:0 4px 6px rgba(0,0,0,.05)}
.case-card .tag{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:4px;font-size:.75em;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.case-card h4{color:var(--primary);font-size:1.1em;margin-bottom:8px}
.case-card p{color:var(--text-light);font-size:.9em;margin-bottom:12px}
.case-card .meta{display:flex;gap:15px;font-size:.85em;color:var(--text-light);border-top:1px solid #e2e8f0;padding-top:12px}
.case-card .meta strong{color:var(--primary)}

.calc-box{background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.calc-box h3{color:var(--primary);margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:1.3em}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;color:var(--primary);font-size:.9em}
.form-group select,.form-group input{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:8px;font-size:1em;transition:border-color .3s;background:#fff}
.form-group select:focus,.form-group input:focus{outline:none;border-color:var(--accent)}

.btn-calc{width:100%;padding:14px;background:var(--accent);color:var(--primary);border:none;border-radius:8px;font-size:1.05em;font-weight:700;cursor:pointer;transition:all .3s;margin-top:10px}
.btn-calc:hover{background:var(--accent-hover);transform:translateY(-2px);box-shadow:0 5px 15px rgba(245,158,11,.3)}

.result-box{display:none;margin-top:30px;background:#f0fdf4;border:2px solid var(--success);border-radius:12px;padding:25px;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #bbf7d0;flex-wrap:wrap;gap:15px}
.result-date{font-size:1.8em;font-weight:800;color:var(--danger)}
.result-detail{color:var(--text);margin-bottom:8px;font-size:.95em}
.result-detail strong{color:var(--primary)}
